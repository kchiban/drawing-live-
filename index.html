<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #f0f0f0; }
    .container { display: flex; height: 100vh; }
    .canvas-area { flex: 1; display: flex; flex-direction: column; background: white; }
    .header { padding: 10px; background: #6C5CE7; color: white; font-weight: bold; }
    canvas { flex: 1; cursor: crosshair; }
    .toolbar { padding: 10px; background: #f9f9f9; border-top: 1px solid #ddd; display: flex; gap: 10px; }
    .sidebar { width: 250px; background: #f9f9f9; border-left: 1px solid #ddd; padding: 10px; overflow-y: auto; }
    input, button { padding: 8px; margin: 5px 0; font-size: 14px; }
    button { background: #6C5CE7; color: white; border: none; cursor: pointer; border-radius: 4px; width: 100%; }
    button:hover { background: #5f4ed1; }
    .user { padding: 8px; background: white; margin: 5px 0; border-radius: 4px; border-left: 3px solid; }
    .online { color: green; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-area">
      <div class="header">🎨 Collaborative Drawing Board</div>
      <canvas id="canvas"></canvas>
      <div class="toolbar">
        <input type="color" id="colorPicker" value="#000000">
        <input type="range" id="brushSize" min="1" max="50" value="3">
        <button id="clearBtn">Clear Canvas</button>
      </div>
    </div>
    <div class="sidebar">
      <h3>Join</h3>
      <input type="text" id="userNameInput" placeholder="Your name">
      <button id="joinBtn">Join Drawing</button>
      <div id="userInfo" style="display:none; margin-top:10px;">
        <p>Name: <strong id="displayName"></strong></p>
        <p>Users Online: <span id="onlineCount">0</span></p>
      </div>
      <h3 style="margin-top:20px;">Users</h3>
      <div id="usersList"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const socket = io();

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let isDrawing = false;
    let userName = '';
    let userColor = '#000000';
    let brushSize = 3;
    let joined = false;
    let lastX = 0, lastY = 0;

    // Resize canvas
    window.addEventListener('resize', () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    });

    // Join
    document.getElementById('joinBtn').addEventListener('click', () => {
      userName = document.getElementById('userNameInput').value || 'Anonymous';
      socket.emit('user_join', { userName });
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('displayName').textContent = userName;
      joined = true;
    });

    // Drawing
    canvas.addEventListener('mousedown', (e) => { 
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;
    });
    canvas.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('mouseleave', () => { isDrawing = false; });

    canvas.addEventListener('mousemove', (e) => {
      if (!joined || !isDrawing) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.strokeStyle = userColor;
      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.stroke();

      socket.emit('draw', { fromX: lastX, fromY: lastY, toX: x, toY: y, color: userColor, size: brushSize });

      lastX = x;
      lastY = y;
    });

    // Color and brush
    document.getElementById('colorPicker').addEventListener('change', (e) => {
      userColor = e.target.value;
    });

    document.getElementById('brushSize').addEventListener('input', (e) => {
      brushSize = e.target.value;
    });

    // Clear
    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      socket.emit('clear_canvas');
    });

    // Socket events
    socket.on('welcome', (data) => {
      document.getElementById('onlineCount').textContent = data.onlineCount;
      if (data.drawingHistory) {
        data.drawingHistory.forEach(event => {
          ctx.strokeStyle = event.color;
          ctx.lineWidth = event.size;
          ctx.beginPath();
          ctx.moveTo(event.fromX, event.fromY);
          ctx.lineTo(event.toX, event.toY);
          ctx.stroke();
        });
      }
    });

    socket.on('draw', (data) => {
      ctx.strokeStyle = data.color;
      ctx.lineWidth = data.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(data.fromX, data.fromY);
      ctx.lineTo(data.toX, data.toY);
      ctx.stroke();
    });

    socket.on('user_joined', (data) => {
      document.getElementById('onlineCount').textContent = data.onlineCount;
      const usersList = document.getElementById('usersList');
      const userEl = document.createElement('div');
      userEl.className = 'user';
      userEl.style.borderColor = data.userColor || '#000';
      userEl.innerHTML = `<strong>${data.userName}</strong><br><span class="online">● Online</span>`;
      usersList.appendChild(userEl);
    });

    socket.on('user_left', (data) => {
      document.getElementById('onlineCount').textContent = data.onlineCount;
    });
  </script>
</body>
</html>
